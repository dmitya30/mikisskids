# Add these directives inside the mikisskids.ru server context via:
# /etc/nginx/fastpanel2-sites/mikiss/mikisskids.ru.includes
#
# Do not edit the FASTPANEL-generated virtual host directly.

error_page 404 /404.html;

location = /404.html {
    internal;
}

# Historical URLs from the previous Tilda site.
location = /suitcase {
    return 301 https://mikisskids.ru/travel-seat/;
}

location = /tproduct/713100056932-kreslo-mikisskids {
    return 301 https://mikisskids.ru/chair/;
}

location = /public_offer {
    return 301 https://mikisskids.ru/legal/offer/;
}

location = /agreement {
    return 301 https://mikisskids.ru/legal/agreement/;
}

location = /personal_data {
    return 301 https://mikisskids.ru/legal/consent/;
}

location = /success_payment {
    return 410;
}
