# Canonical Nginx include for mikisskids.ru.
# Install only with deploy/install-nginx-site-config.
# Do not replace this configuration with an individual fragment.

# Add this file's location blocks to:
# /etc/nginx/fastpanel2-sites/mikiss/mikisskids.ru.includes
#
# Do not edit the FASTPANEL-generated main virtual host directly.
# The real secret is validated by the application.
# Access logging is disabled for the secret URL.

location ^~ /api/tilda/paid/ {
    access_log off;
    client_max_body_size 64k;

    limit_except POST {
        deny all;
    }

    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";

    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
}

location ^~ /api/ {
    return 404;
}

# Add these directives inside the mikisskids.ru server context via:
# /etc/nginx/fastpanel2-sites/mikiss/mikisskids.ru.includes
#
# Do not edit the FASTPANEL-generated virtual host directly.

error_page 404 /404.html;

location = /404.html {
    internal;
}

# Historical URLs from the previous Tilda site.
location = /suitcase {
    return 301 https://mikisskids.ru/travel-seat/;
}

location = /tproduct/713100056932-kreslo-mikisskids {
    return 301 https://mikisskids.ru/chair/;
}

location = /public_offer {
    return 301 https://mikisskids.ru/legal/offer/;
}

location = /agreement {
    return 301 https://mikisskids.ru/legal/agreement/;
}

location = /personal_data {
    return 301 https://mikisskids.ru/legal/consent/;
}

location = /success_payment {
    return 410;
}
